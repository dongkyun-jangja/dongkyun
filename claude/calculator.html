<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    }

    .calculator {
      width: 320px;
      background: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 64px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red   { background: #ff5f57; }
    .dot.yellow{ background: #febc2e; }
    .dot.green { background: #28c840; }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #3a3a3a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Display */
    .display {
      padding: 24px 20px 16px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 4px;
    }

    .display-expression {
      font-size: 13px;
      color: #3a3a3a;
      min-height: 18px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .display-main {
      font-size: 42px;
      font-weight: 300;
      color: #f0f0f0;
      letter-spacing: -1px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Buttons grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #1a1a1a;
      border-top: 1px solid #1a1a1a;
    }

    button {
      position: relative;
      padding: 0;
      height: 72px;
      border: none;
      background: #111111;
      color: #c0c0c0;
      font-size: 16px;
      font-weight: 400;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      outline: none;
      user-select: none;
    }

    button:hover  { background: #161616; }
    button:active { background: #0d0d0d; transform: scale(0.97); }

    /* Span-2 (zero button) */
    button.span2 {
      grid-column: span 2;
      text-align: left;
      padding-left: 28px;
    }

    /* Function buttons (C, +/-, %) */
    button.fn {
      color: #888;
      font-size: 15px;
    }
    button.fn:hover { background: #161616; color: #aaa; }

    /* Operator buttons */
    button.op {
      color: #9b8afb;
      font-weight: 500;
      font-size: 20px;
    }
    button.op:hover { background: #1a1630; color: #b9adfc; }

    /* Equals button */
    button.eq {
      background: #5b4cf5;
      color: #ffffff;
      font-size: 22px;
      font-weight: 400;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    button.eq:hover  { background: #6b5cf6; }
    button.eq:active { background: #4a3de0; }

    /* Subtle inner divider line on hover */
    button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="header">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="header-title">Calculator</span>
    <span style="width:36px"></span>
  </div>

  <div class="display">
    <div class="display-expression" id="expression"></div>
    <div class="display-main" id="display">0</div>
  </div>

  <div class="buttons">
    <!-- Row 1 -->
    <button class="fn" data-action="clear">C</button>
    <button class="fn" data-action="sign">+/−</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-action="operator" data-op="÷">÷</button>
    <!-- Row 2 -->
    <button data-action="digit" data-digit="7">7</button>
    <button data-action="digit" data-digit="8">8</button>
    <button data-action="digit" data-digit="9">9</button>
    <button class="op" data-action="operator" data-op="×">×</button>
    <!-- Row 3 -->
    <button data-action="digit" data-digit="4">4</button>
    <button data-action="digit" data-digit="5">5</button>
    <button data-action="digit" data-digit="6">6</button>
    <button class="op" data-action="operator" data-op="−">−</button>
    <!-- Row 4 -->
    <button data-action="digit" data-digit="1">1</button>
    <button data-action="digit" data-digit="2">2</button>
    <button data-action="digit" data-digit="3">3</button>
    <button class="op" data-action="operator" data-op="+">+</button>
    <!-- Row 5 -->
    <button class="span2" data-action="digit" data-digit="0">0</button>
    <button data-action="decimal">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
  const display    = document.getElementById('display');
  const expression = document.getElementById('expression');

  let current    = '0';
  let previous   = null;
  let operator   = null;
  let waitNext   = false;
  let exprStr    = '';

  function updateDisplay(value) {
    const s = parseFloat(value).toString();
    display.textContent = s.length > 10 ? parseFloat(value).toExponential(4) : s;
  }

  function handleDigit(d) {
    if (waitNext) { current = d; waitNext = false; }
    else current = current === '0' ? d : current + d;
    updateDisplay(current);
  }

  function handleDecimal() {
    if (waitNext) { current = '0.'; waitNext = false; }
    else if (!current.includes('.')) current += '.';
    display.textContent = current;
  }

  function handleOperator(op) {
    if (operator && !waitNext) calculate();
    previous   = current;
    operator   = op;
    exprStr    = `${previous} ${op}`;
    expression.textContent = exprStr;
    waitNext   = true;
  }

  function calculate() {
    if (!operator || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result;
    switch (operator) {
      case '+': result = a + b; break;
      case '−': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b !== 0 ? a / b : 'Error'; break;
    }
    exprStr = `${previous} ${operator} ${current} =`;
    expression.textContent = exprStr;
    current  = result.toString();
    operator = null;
    previous = null;
    waitNext = true;
    updateDisplay(current);
  }

  function handleClear() {
    current   = '0';
    previous  = null;
    operator  = null;
    waitNext  = false;
    exprStr   = '';
    expression.textContent = '';
    display.textContent = '0';
  }

  function handleSign() {
    current = (parseFloat(current) * -1).toString();
    updateDisplay(current);
  }

  function handlePercent() {
    current = (parseFloat(current) / 100).toString();
    updateDisplay(current);
  }

  document.querySelector('.buttons').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const { action, digit, op } = btn.dataset;
    if (action === 'digit')    handleDigit(digit);
    if (action === 'decimal')  handleDecimal();
    if (action === 'operator') handleOperator(op);
    if (action === 'equals')   calculate();
    if (action === 'clear')    handleClear();
    if (action === 'sign')     handleSign();
    if (action === 'percent')  handlePercent();
  });

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
    else if (e.key === '.') handleDecimal();
    else if (e.key === '+') handleOperator('+');
    else if (e.key === '-') handleOperator('−');
    else if (e.key === '*') handleOperator('×');
    else if (e.key === '/') { e.preventDefault(); handleOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') handleClear();
    else if (e.key === 'Backspace') {
      if (current.length > 1) { current = current.slice(0, -1); display.textContent = current; }
      else { current = '0'; display.textContent = '0'; }
    }
  });
</script>

</body>
</html>
